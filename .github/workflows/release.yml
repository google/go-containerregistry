name: goreleaser

on:
  push:
    tags: ['*']

env:
  GOTOOLCHAIN: auto

jobs:
  goreleaser:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Unshallow
        run: git fetch --prune --unshallow
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true # no-op if full version is specified
          cache: false
      - name: Verify release Go version
        run: |
          expected="$(go mod edit -json | jq -r .Toolchain)"
          actual="$(go env GOVERSION)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Release Go version mismatch: got ${actual}, want ${expected}" >&2
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        id: run-goreleaser
        with:
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate subject
        id: hash
        env:
          ARTIFACTS: "${{ steps.run-goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail

          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select (.type=="Checksum") | .path')
          echo "hashes=$(cat $checksum_file | base64 -w0)" >> $GITHUB_OUTPUT
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Clean up prior staged artifacts in OSS Exit Gate repository
        run: |
          set -euo pipefail
          EXISTING_PKGS="$(gcloud artifacts packages list \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=go-containerregistry--githubreleases \
            --format='value(name)' 2>/dev/null || true)"
          for pkg in ${EXISTING_PKGS}; do
            gcloud artifacts packages delete "${pkg}" \
              --project=oss-exit-gate-prod \
              --location=us \
              --repository=go-containerregistry--githubreleases \
              --quiet || true
          done

      - name: Stage release artifacts and trigger OSS Exit Gate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NAME: ${{ github.ref_name }}
          IS_LATEST: true
          IS_DRAFT: false
          IS_PRERELEASE: false
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          STAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/exit-gate-stage.XXXXXX")"
          trap 'rm -rf "${STAGE_DIR}"' EXIT
          find dist -maxdepth 1 -type f ! -name 'artifacts.json' ! -name 'config.yaml' ! -name 'metadata.json' -exec cp {} "${STAGE_DIR}/" \;
          ls -la "${STAGE_DIR}"
          PKG_VERSION="$(printf '%s' "${RELEASE_TAG#v}" | tr '[:upper:]/+' '[:lower:]--' | sed 's/^[^a-z0-9]*//; s/[^a-z0-9._-]/-/g; s/[^a-z0-9]*$//')"
          PKG_VERSION="${PKG_VERSION:-0.0.0}"
          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --repository=go-containerregistry--githubreleases \
            --location=us \
            --package=go-containerregistry \
            --version="${PKG_VERSION}" \
            --source-directory="${STAGE_DIR}"
          python3 - <<'PY' > manifest.json
          import json, os
          is_draft = os.environ['IS_DRAFT'].lower() == 'true'
          is_pre = os.environ['IS_PRERELEASE'].lower() == 'true'
          is_latest = False if (is_draft or is_pre) else (os.environ['IS_LATEST'].lower() == 'true')
          manifest = {
              'publish_all': True,
              'registry_config': {
                  'github_releases': {
                      'name': os.environ['RELEASE_NAME'],
                      'tag': os.environ['RELEASE_TAG'],
                      'is_latest': is_latest,
                      'is_draft': is_draft,
                      'is_prerelease': is_pre,
                  }
              }
          }
          print(json.dumps(manifest, indent=2))
          PY
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/go-containerregistry/githubreleases/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"

  provenance:
    needs: [goreleaser]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] SLSA verifier requires pinning by version (https://github.com/slsa-framework/slsa-verifier/issues/12)
    with:
      base64-subjects: "${{ needs.goreleaser.outputs.hashes }}"
      upload-assets: true # upload to a new release

  verification:
    needs: [goreleaser, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install SLSA verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1
      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE: "${{ needs.provenance.outputs.provenance-name }}"
        run: |
          set -euo pipefail
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p "*.tar.gz"
          gh -R "$GITHUB_REPOSITORY" release download "$GITHUB_REF_NAME" -p $PROVENANCE
      - name: Verify assets
        env:
          CHECKSUMS: ${{ needs.goreleaser.outputs.hashes }}
          PROVENANCE: "${{ needs.provenance.outputs.provenance-name }}"
        run: |
          set -euo pipefail
          checksums=$(echo "$CHECKSUMS" | base64 -d)
          while read -r line; do
              fn=$(echo $line | cut -d ' ' -f2)
              echo "Verifying $fn"
              slsa-verifier verify-artifact "$fn" \
                            --provenance-path "$PROVENANCE" \
                            --source-uri "github.com/$GITHUB_REPOSITORY" \
                            --source-tag "$GITHUB_REF_NAME"
          done <<<"$checksums"
