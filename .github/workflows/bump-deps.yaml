name: Bump Deps

on:
  schedule:
  - cron: '0 6 * * 2' # weekly at 6AM Tuesday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-deps:
    name: Bump Deps

    # Don't bother bumping deps on forks.
    if: ${{ github.repository == 'google/go-containerregistry' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      with:
        go-version-file: 'go.mod'

    - run: ./hack/bump-deps.sh
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
      with:
        title: "Bump dependencies using hack/bump-deps.sh"
        commit-message: "Bump dependencies using hack/bump-deps.sh"
        labels: dependencies
        assignees: imjasonh
        delete-branch: true
