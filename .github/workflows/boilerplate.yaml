name: Boilerplate

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:

  check:
    name: Boilerplate Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Keep running if one leg fails.
      matrix:
        extension:
        - go
        - sh

        # Map between extension and human-readable name.
        include:
        - extension: go
          language: Go
        - extension: sh
          language: Bash

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: chainguard-dev/actions/boilerplate@e94104128fff55b3c5e1831a8bbbf198603156f9 # v1.7.1
        with:
          extension: ${{ matrix.extension }}
          language: ${{ matrix.language }}
